# Settings used only by the bulk seeder profile.
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=bulkseed

# The app is now a web app, so without this the seeder would finish and then sit
# there serving HTTP. Run it headless so the process exits when loading is done.
spring.main.web-application-type=none

# Logging every one of the ~9000 inserts makes the load an order of magnitude slower.
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
