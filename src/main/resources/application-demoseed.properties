# Local demo dataset loader. Headless so the process exits when seeding finishes.
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demoseed
spring.main.web-application-type=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# Shared password for every seeded demo login. Local use only.
storems.demo.password=demo1234
